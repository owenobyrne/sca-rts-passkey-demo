name: Deploy demo to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/passkeys-psd2-dynamic-linking-26cv7g
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Requires Pages to be switched on once, by hand, with the GitHub Actions
      # source: Settings -> Pages -> Build and deployment. The workflow token
      # cannot create the Pages site itself (that needs repository admin), so
      # this step fails with "Get Pages site failed" until that is done.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
